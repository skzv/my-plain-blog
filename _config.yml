# Site Info
title:              "Sasha Kuznetsov's Blog"
description:        "Sasha Kuznetsov's experiments and explanations in machine learning, computer vision, quantitative finance, and software, with interactive demos and side projects."
author_name:        "Sasha Kuznetsov"
author:
  name:             "Sasha Kuznetsov"
  url:              "https://skz.dev"
  twitter:          skzv
logo_url:           https://avatars.githubusercontent.com/u/11140296?v=4 # Get it from GitHub API: https://api.github.com/users/<username>
lang:               en-US
locale:             en_US

twitter:
  username:         skzv
  card:             summary_large_image

social:
  name:             Sasha Kuznetsov
  links:
    - https://github.com/skzv
    - https://twitter.com/skzv
    - https://skz.dev

# Site Settings
url:                https://blog.skz.dev # main url
# baseurl:            /the-plain
permalink:          /:title # Post permalink
timezone:           America/Los_Angeles # https://en.wikipedia.org/wiki/List_of_tz_database_time_zones
mathjax:            true  # enables support for mathjax - set to 'false' to disable

# Site Build
highlighter:        rouge
markdown:           kramdown
kramdown:
    input:          GFM
sass:
    style:          compressed

# Other Params
include:            [ "robots.txt" ]
exclude:            [ "LICENSE", "README.md", "CLAUDE.md", "AGENTS.md", "vendor", "Gemfile", "Gemfile.lock", "script", "tests", "docs", "node_modules", "package.json", "package-lock.json" ]
plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag



defaults:
  -
    scope:
      path:         ""
    values:
      layout:       null
      image:        /assets/img/preview-banner.png
      image_width:  1200
      image_height: 630
      image_alt:    "Sasha Kuznetsov's Blog"
  -
    scope:
      type:         "pages"
    values:
      layout:       "page"
  -
    scope:
      type:         "posts"
    values:
      layout:       "post"
