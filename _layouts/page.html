---
layout: default
---
{% assign lang_code = page.lang_code | default: 'en' %}
{% assign t = site.data.i18n[lang_code] %}

<article>

	<h1 class="title">{{ page.title | escape }}</h1>

	<div class="divider"></div>

	{{ content }}

</article>

<nav class="page-navigation code" aria-label="{{ t.nav_post_label | escape }}">
	<a class="home" href="{{ t.home_url | relative_url }}">&larr; {{ t.index_label }}</a>
</nav>
